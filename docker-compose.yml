services:
  app:
    build: .
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ieccmndb;Username=ieccmnsvc;Password=Minneapolis2@"
      PayPal__ClientId: ""
      PayPal__ClientSecret: ""
      PayPal__Mode: sandbox
      Smtp__Host: smtp.gmail.com
      Smtp__Port: "587"
      Smtp__Username: ""
      Smtp__Password: ""
      Smtp__FromName: "IECC Masjid"
      Smtp__FromEmail: ""
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ieccmndb
      POSTGRES_USER: ieccmnsvc
      POSTGRES_PASSWORD: Minneapolis2@
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ieccmnsvc -d ieccmndb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
