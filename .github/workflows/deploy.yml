name: Build and Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CONTAINER_NAME: iecc
  POSTGRES_CONTAINER_NAME: iecc-postgres
  DOCKER_NETWORK: iecc-net
  POSTGRES_VOLUME: iecc-pgdata
  POSTGRES_DB: iecc
  POSTGRES_USER: iecc
  HOST_PORT: 5000
  CONTAINER_PORT: 8080

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hostinger Ubuntu VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Verify SSH network access
        shell: bash
        run: |
          PORT="${{ secrets.VPS_SSH_PORT }}"
          PORT="${PORT:-22}"
          echo "Testing SSH connectivity to ${{ secrets.VPS_HOST }}:$PORT ..."
          nc -vz -w 15 "${{ secrets.VPS_HOST }}" "$PORT"

      - name: Deploy Docker container over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          POSTGRES_CONTAINER_NAME: ${{ env.POSTGRES_CONTAINER_NAME }}
          DOCKER_NETWORK: ${{ env.DOCKER_NETWORK }}
          POSTGRES_VOLUME: ${{ env.POSTGRES_VOLUME }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MODE: ${{ secrets.PAYPAL_MODE }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 20m
          script_stop: true
          envs: IMAGE,CONTAINER_NAME,POSTGRES_CONTAINER_NAME,DOCKER_NETWORK,POSTGRES_VOLUME,POSTGRES_DB,POSTGRES_USER,HOST_PORT,CONTAINER_PORT,GHCR_PAT,GHCR_USER,PAYPAL_CLIENT_ID,PAYPAL_CLIENT_SECRET,PAYPAL_MODE,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM_EMAIL,DB_PASSWORD,ADMIN_USERNAME,ADMIN_PASSWORD
          script: |
            set -euxo pipefail

            echo "Validating required values..."
            : "${IMAGE:?IMAGE is empty}"
            : "${GHCR_PAT:?GHCR_PAT secret is not set}"
            : "${DB_PASSWORD:?DB_PASSWORD secret is not set}"
            : "${ADMIN_PASSWORD:?ADMIN_PASSWORD secret is not set}"
            : "${HOST_PORT:?HOST_PORT is empty}"
            : "${CONTAINER_PORT:?CONTAINER_PORT is empty}"

            command -v docker >/dev/null 2>&1 || { echo "ERROR: Docker is not installed."; exit 1; }
            docker info >/dev/null 2>&1 || { echo "ERROR: Docker daemon is not running or current user cannot access Docker."; exit 1; }

            echo "Creating Docker network if needed..."
            docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 || docker network create "$DOCKER_NETWORK"

            echo "Logging in to GitHub Container Registry..."
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            echo "Checking Postgres container..."
            POSTGRES_STATUS="$(docker inspect -f '{{.State.Status}}' "$POSTGRES_CONTAINER_NAME" 2>/dev/null || echo 'not-found')"
            echo "Postgres status: $POSTGRES_STATUS"

            case "$POSTGRES_STATUS" in
              running)
                echo "Postgres already running — nothing to do."
                ;;
              exited|dead)
                echo "Restarting stopped Postgres container..."
                docker start "$POSTGRES_CONTAINER_NAME"
                ;;
              restarting)
                echo "Postgres stuck in restart loop — recreating (data volume preserved)..."
                docker logs "$POSTGRES_CONTAINER_NAME" --tail=50 || true
                docker rm -f "$POSTGRES_CONTAINER_NAME"
                docker run -d \
                  --name "$POSTGRES_CONTAINER_NAME" \
                  --network "$DOCKER_NETWORK" \
                  --restart unless-stopped \
                  -v "$POSTGRES_VOLUME":/var/lib/postgresql/data \
                  -e POSTGRES_DB="$POSTGRES_DB" \
                  -e POSTGRES_USER="$POSTGRES_USER" \
                  -e POSTGRES_PASSWORD="$DB_PASSWORD" \
                  postgres:16-alpine
                ;;
              not-found)
                echo "Creating Postgres container for the first time..."
                docker run -d \
                  --name "$POSTGRES_CONTAINER_NAME" \
                  --network "$DOCKER_NETWORK" \
                  --restart unless-stopped \
                  -v "$POSTGRES_VOLUME":/var/lib/postgresql/data \
                  -e POSTGRES_DB="$POSTGRES_DB" \
                  -e POSTGRES_USER="$POSTGRES_USER" \
                  -e POSTGRES_PASSWORD="$DB_PASSWORD" \
                  postgres:16-alpine
                ;;
              *)
                echo "Unknown status '$POSTGRES_STATUS' — attempting start..."
                docker start "$POSTGRES_CONTAINER_NAME" || true
                ;;
            esac

            echo "Waiting for Postgres readiness (up to 60s)..."
            PGREADY=0
            for i in $(seq 1 30); do
              docker exec "$POSTGRES_CONTAINER_NAME" pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 && PGREADY=1 && break || true
              sleep 2
            done
            if [ "$PGREADY" -eq 0 ]; then
              echo "ERROR: Postgres did not become ready after 60s."
              docker logs "$POSTGRES_CONTAINER_NAME" --tail=100 || true
              exit 1
            fi
            echo "Postgres is ready."

            echo "Removing existing app container..."
            docker rm -f "$CONTAINER_NAME" || true

            echo "Starting app container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --network "$DOCKER_NETWORK" \
              --restart unless-stopped \
              -p 127.0.0.1:${HOST_PORT}:${CONTAINER_PORT} \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e ASPNETCORE_URLS="http://+:${CONTAINER_PORT}" \
              -e "ConnectionStrings__DefaultConnection=Host=${POSTGRES_CONTAINER_NAME};Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${DB_PASSWORD}" \
              -e PayPal__ClientId="$PAYPAL_CLIENT_ID" \
              -e PayPal__ClientSecret="$PAYPAL_CLIENT_SECRET" \
              -e PayPal__Mode="$PAYPAL_MODE" \
              -e Smtp__Host="smtp.gmail.com" \
              -e Smtp__Port="587" \
              -e Smtp__Username="$SMTP_USERNAME" \
              -e Smtp__Password="$SMTP_PASSWORD" \
              -e Smtp__FromName="IECC Masjid" \
              -e Smtp__FromEmail="$SMTP_FROM_EMAIL" \
              -e Admin__Username="${ADMIN_USERNAME:-admin}" \
              -e Admin__Password="$ADMIN_PASSWORD" \
              "$IMAGE"

            echo "Waiting for app to respond..."
            sleep 10

            echo "Container status:"
            docker ps -a --filter "name=$CONTAINER_NAME" --filter "name=$POSTGRES_CONTAINER_NAME"

            echo "Testing app on localhost..."
            APPREADY=0
            for i in $(seq 1 12); do
              curl -fsS "http://127.0.0.1:${HOST_PORT}" >/dev/null 2>&1 && APPREADY=1 && break || true
              sleep 5
            done
            if [ "$APPREADY" -eq 0 ]; then
              echo "ERROR: App did not respond after 60s."
              docker inspect "$CONTAINER_NAME" --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}}' || true
              docker logs "$CONTAINER_NAME" --tail=200 || true
              docker logs "$POSTGRES_CONTAINER_NAME" --tail=50 || true
              exit 1
            fi
            echo "App is responding on http://127.0.0.1:${HOST_PORT}"

            echo "Cleaning old images..."
            docker image prune -f
