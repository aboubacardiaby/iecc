name: Build and Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CONTAINER_NAME: iecc
  HOST_PORT: 5000
  CONTAINER_PORT: 8080

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hostinger Ubuntu VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Docker container over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MODE: ${{ secrets.PAYPAL_MODE }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          envs: IMAGE,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT,GHCR_PAT,GHCR_USER,PAYPAL_CLIENT_ID,PAYPAL_CLIENT_SECRET,PAYPAL_MODE,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM_EMAIL
          script: |
            set -e

            echo "Logging in to GitHub Container Registry..."
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            echo "Stopping existing container if it exists..."
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            echo "Starting new container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 127.0.0.1:${HOST_PORT}:${CONTAINER_PORT} \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e PayPal__ClientId="$PAYPAL_CLIENT_ID" \
              -e PayPal__ClientSecret="$PAYPAL_CLIENT_SECRET" \
              -e PayPal__Mode="$PAYPAL_MODE" \
              -e Smtp__Host=smtp.gmail.com \
              -e Smtp__Port=587 \
              -e Smtp__Username="$SMTP_USERNAME" \
              -e Smtp__Password="$SMTP_PASSWORD" \
              -e Smtp__FromName="IECC Masjid" \
              -e Smtp__FromEmail="$SMTP_FROM_EMAIL" \
              "$IMAGE"

            echo "Current container status:"
            docker ps --filter "name=$CONTAINER_NAME"

            echo "Checking application response on localhost..."
            sleep 5
            curl -f "http://127.0.0.1:${HOST_PORT}" || docker logs "$CONTAINER_NAME" --tail 100

            echo "Cleaning old Docker images..."
            docker image prune -f
