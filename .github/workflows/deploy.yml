name: Build and Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CONTAINER_NAME: iecc
  HOST_PORT: 5000
  CONTAINER_PORT: 8080

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          # IMPORTANT: Do not include :latest here. docker/metadata-action adds tags later.
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hostinger Ubuntu VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Verify SSH network access
        shell: bash
        run: |
          echo "Testing SSH connectivity to VPS..."
          echo "Host: ${{ secrets.VPS_HOST }}"
          echo "Port: ${{ secrets.VPS_SSH_PORT }}"
          nc -vz -w 15 ${{ secrets.VPS_HOST }} ${{ secrets.VPS_SSH_PORT }}

      - name: Deploy Docker container over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MODE: ${{ secrets.PAYPAL_MODE }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          timeout: 120s
          command_timeout: 20m
          script_stop: true
          envs: IMAGE,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT,GHCR_PAT,GHCR_USER,PAYPAL_CLIENT_ID,PAYPAL_CLIENT_SECRET,PAYPAL_MODE,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM_EMAIL,DB_PASSWORD
          script: |
            set -e

            # ── Docker network ──────────────────────────────
            docker network create iecc-net 2>/dev/null || true

            # ── Postgres (start once, data persists in volume) ──
            if ! docker inspect iecc-postgres &>/dev/null; then
              echo "Starting Postgres container for the first time..."
              docker run -d \
                --name iecc-postgres \
                --network iecc-net \
                --restart unless-stopped \
                -v iecc-pgdata:/var/lib/postgresql/data \
                -e POSTGRES_DB=iecc \
                -e POSTGRES_USER=iecc \
                -e POSTGRES_PASSWORD="$DB_PASSWORD" \
                postgres:16-alpine
              echo "Waiting for Postgres to be ready..."
              sleep 10
            else
              echo "Postgres container already running, skipping..."
            fi

            # ── App container ───────────────────────────────
            echo "Logging in to GitHub Container Registry..."
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            echo "Stopping existing app container..."
            docker stop "$CONTAINER_NAME" || true
            docker rm   "$CONTAINER_NAME" || true

            echo "Starting app container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --network iecc-net \
              --restart unless-stopped \
              -p 127.0.0.1:${HOST_PORT}:${CONTAINER_PORT} \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e "ConnectionStrings__DefaultConnection=Host=iecc-postgres;Port=5432;Database=iecc;Username=iecc;Password=$DB_PASSWORD" \
              -e PayPal__ClientId="$PAYPAL_CLIENT_ID" \
              -e PayPal__ClientSecret="$PAYPAL_CLIENT_SECRET" \
              -e PayPal__Mode="$PAYPAL_MODE" \
              -e Smtp__Host=smtp.gmail.com \
              -e Smtp__Port=587 \
              -e Smtp__Username="$SMTP_USERNAME" \
              -e Smtp__Password="$SMTP_PASSWORD" \
              -e Smtp__FromName="IECC Masjid" \
              -e Smtp__FromEmail="$SMTP_FROM_EMAIL" \
              "$IMAGE"

            echo "Container status:"
            docker ps --filter "name=$CONTAINER_NAME"

            echo "Checking app response..."
            sleep 5
            curl -f "http://127.0.0.1:${HOST_PORT}" || docker logs "$CONTAINER_NAME" --tail 100

            echo "Cleaning old images..."
            docker image prune -f
