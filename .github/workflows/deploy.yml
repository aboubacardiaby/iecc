name: Build and Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CONTAINER_NAME: iecc
  POSTGRES_CONTAINER_NAME: iecc-postgres
  DOCKER_NETWORK: iecc-net
  POSTGRES_VOLUME: iecc-pgdata
  POSTGRES_DB: iecc
  POSTGRES_USER: iecc
  HOST_PORT: 5000
  CONTAINER_PORT: 8080

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hostinger Ubuntu VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Verify SSH network access
        shell: bash
        run: |
          PORT="${{ secrets.VPS_SSH_PORT }}"
          PORT="${PORT:-22}"
          echo "Testing SSH connectivity to ${{ secrets.VPS_HOST }}:$PORT ..."
          nc -vz -w 15 "${{ secrets.VPS_HOST }}" "$PORT"

      - name: Deploy Docker container over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          POSTGRES_CONTAINER_NAME: ${{ env.POSTGRES_CONTAINER_NAME }}
          DOCKER_NETWORK: ${{ env.DOCKER_NETWORK }}
          POSTGRES_VOLUME: ${{ env.POSTGRES_VOLUME }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          HOST_PORT: ${{ env.HOST_PORT }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MODE: ${{ secrets.PAYPAL_MODE }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 20m
          script_stop: true
          envs: IMAGE,CONTAINER_NAME,POSTGRES_CONTAINER_NAME,DOCKER_NETWORK,POSTGRES_VOLUME,POSTGRES_DB,POSTGRES_USER,HOST_PORT,CONTAINER_PORT,GHCR_PAT,GHCR_USER,PAYPAL_CLIENT_ID,PAYPAL_CLIENT_SECRET,PAYPAL_MODE,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM_EMAIL,DB_PASSWORD,ADMIN_USERNAME,ADMIN_PASSWORD
          script: |
            set -eo pipefail

            : "${IMAGE:?IMAGE is empty}"
            : "${GHCR_PAT:?GHCR_PAT not set}"
            : "${DB_PASSWORD:?DB_PASSWORD not set}"
            : "${ADMIN_PASSWORD:?ADMIN_PASSWORD not set}"

            command -v docker >/dev/null 2>&1 || { echo "Docker not installed. Run: curl -fsSL https://get.docker.com | sh"; exit 1; }
            docker info >/dev/null 2>&1 || { echo "Docker daemon not running"; exit 1; }

            docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 || docker network create "$DOCKER_NETWORK"

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"

            echo "=== Postgres ==="
            docker inspect "$POSTGRES_CONTAINER_NAME" >/dev/null 2>&1 || docker run -d \
              --name "$POSTGRES_CONTAINER_NAME" --network "$DOCKER_NETWORK" --restart unless-stopped \
              -v "$POSTGRES_VOLUME":/var/lib/postgresql/data \
              -e POSTGRES_DB="$POSTGRES_DB" -e POSTGRES_USER="$POSTGRES_USER" -e POSTGRES_PASSWORD="$DB_PASSWORD" \
              postgres:16-alpine
            docker start "$POSTGRES_CONTAINER_NAME" >/dev/null 2>&1 || true

            echo "Waiting for Postgres..."
            PGREADY=0
            for i in $(seq 1 30); do
              docker exec "$POSTGRES_CONTAINER_NAME" pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 \
                && PGREADY=1 && break || true
              sleep 2
            done
            test "$PGREADY" -eq 1 || { docker logs "$POSTGRES_CONTAINER_NAME" --tail=50; exit 1; }
            echo "Postgres ready."

            echo "=== App ==="
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            docker run -d \
              --name "$CONTAINER_NAME" --network "$DOCKER_NETWORK" --restart unless-stopped \
              -p 127.0.0.1:${HOST_PORT}:${CONTAINER_PORT} \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e ASPNETCORE_URLS="http://+:${CONTAINER_PORT}" \
              -e "ConnectionStrings__DefaultConnection=Host=${POSTGRES_CONTAINER_NAME};Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${DB_PASSWORD}" \
              -e PayPal__ClientId="$PAYPAL_CLIENT_ID" -e PayPal__ClientSecret="$PAYPAL_CLIENT_SECRET" -e PayPal__Mode="$PAYPAL_MODE" \
              -e Smtp__Host="smtp.gmail.com" -e Smtp__Port="587" \
              -e Smtp__Username="$SMTP_USERNAME" -e Smtp__Password="$SMTP_PASSWORD" \
              -e Smtp__FromName="IECC Masjid" -e Smtp__FromEmail="$SMTP_FROM_EMAIL" \
              -e Admin__Username="${ADMIN_USERNAME:-admin}" -e Admin__Password="$ADMIN_PASSWORD" \
              "$IMAGE"

            sleep 10
            APPREADY=0
            for i in $(seq 1 12); do
              curl -fsS "http://127.0.0.1:${HOST_PORT}" >/dev/null 2>&1 && APPREADY=1 && break || true
              sleep 5
            done
            test "$APPREADY" -eq 1 || { docker logs "$CONTAINER_NAME" --tail=100; exit 1; }
            echo "=== Deployed: http://127.0.0.1:${HOST_PORT} ==="

            docker image prune -f
